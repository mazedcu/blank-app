name: Build Reaction Lab APK

on:
  push:
    branches: [reaction-lab-android]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk Mariams-Reaction-Lab.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Mariams-Reaction-Lab-apk
          path: Mariams-Reaction-Lab.apk

      - name: Publish as a downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: reaction-lab-v1.2.${{ github.run_number }}
          name: Mariam's Reaction Lab v1.2 (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          body: Install Mariams-Reaction-Lab.apk on an Android phone (Android 8.0 or newer). Allow "Install unknown apps" once when asked.
          files: Mariams-Reaction-Lab.apk
