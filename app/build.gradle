plugins {
    id 'com.android.application'
}

android {
    namespace 'org.radon.reactionlab'
    compileSdk 34

    defaultConfig {
        applicationId 'org.radon.reactionlab'
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '1.3'
    }

    // One permanent key, so every new build installs over the previous one.
    signingConfigs {
        lab {
            storeFile file('reaction-lab.keystore')
            storePassword 'radonlab2026'
            keyAlias 'reactionlab'
            keyPassword 'radonlab2026'
            enableV1Signing true
            enableV2Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.lab
        }
        debug {
            signingConfig signingConfigs.lab
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Keep the 3D page uncompressed inside the APK so it loads fast.
    androidResources {
        noCompress 'html'
    }
}
